name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  gateway:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gateway/requirements.lock
      - run: python -m venv .venv-gateway
      - run: .venv-gateway/bin/pip install -r gateway/requirements.lock
      - run: npm ci
      - run: npm test -- tests/gateway tests/persistence

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            script: package:windows
          - os: ubuntu-24.04
            script: package:linux
    runs-on: ${{ matrix.os }}
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package desktop app
        shell: bash
        run: |
          set -o pipefail
          DEBUG=electron-builder npm run ${{ matrix.script }} 2>&1 | tee package.log
      - name: Summarize package failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Package failure"
            echo '```text'
            tail -n 200 package.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -Ei 'error|fail|cannot|exception|exit' package.log | tail -n 20 | while IFS= read -r line; do
            echo "::error::${line//%/%%}"
          done
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: package-log-${{ matrix.os }}
          path: package.log
          if-no-files-found: error
      - name: Run packaged smoke test
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
            IRISLENS_DISABLE_SANDBOX=1 xvfb-run -a npm run smoke
          else
            npm run smoke
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: irislens-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    needs: [verify, gateway, package]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/IrisLens-Setup.exe
            release/iris-lens_*_amd64.deb
          fail_on_unmatched_files: true
